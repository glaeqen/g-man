[package]
name = "g-man"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
toml = "1"

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls-no-provider", "json"]

# configure rustls manually (not via reqwest) in order to
# avoid aws-lc-rs dependency which requires glibc (we use musl)
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "process",
    "signal",
    "io-util",
    "time",
]
